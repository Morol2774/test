<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora — animated waves</title>
<style>
  :root{
    --pink:   #ffb3c2;
    --peach:  #f8c9a3;
    --lav:    #cdb8ec;
    --blue:   #93d3ec;
    --blue2:  #75d0ed;
    --bg:     #fbfaf8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1c2430;
    overflow-x: hidden;
  }
 
  /* ---------- фон страницы: медленно перетекающий по палитре градиент ---------- */
  body { background: var(--bg); }
 
  /* обёртка всех фоновых слоёв — 3% прозрачности на весь фон целиком */
  .bg-stack {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: .97;
    pointer-events: none;
  }
  .bg-gradient {
    position: absolute;
    inset: 0;
    /* фон теперь светлый и почти однотонный — цвет несёт лента-волна */
    background-image: linear-gradient(120deg,
      var(--bg) 0%,
      #fdfbfa 30%,
      var(--bg) 55%,
      #fcfbfa 80%,
      var(--bg) 100%);
    background-size: 400% 400%;
    animation: bg-flow 20s ease-in-out infinite;
  }
  @keyframes bg-flow {
    0%   { background-position: 0% 0%; }
    50%  { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
  }
 
  /* ---------- общий рецепт "бегущего" градиента по палитре ---------- */
  .flow {
    background-size: 300% 300%;
    animation: flow 10s ease-in-out infinite;
  }
  @keyframes flow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
 
  /* ============ HERO ============ */
  .hero {
    position: relative;
    min-height: 92vh;
    overflow: hidden;
    padding: 28px 6vw 0;
  }
  @media (max-width: 768px) {
    .hero {
      min-height: 100vh;
      min-height: 100dvh;
    }
  }
 
  /* ---------- волнообразная текстура без чётких границ ---------- */
  .texture-wave {
    position: absolute;
    inset: -25%;
    width: 150%;
    height: 150%;
    z-index: 0;
    pointer-events: none;
    filter: blur(70px);
    mix-blend-mode: multiply;
    opacity: .14;
    background-image:
      radial-gradient(38% 30% at 22% 28%, var(--blue2), transparent 70%),
      radial-gradient(34% 26% at 72% 20%, var(--pink), transparent 70%),
      radial-gradient(40% 32% at 55% 62%, var(--lav), transparent 70%),
      radial-gradient(30% 24% at 15% 75%, var(--peach), transparent 70%),
      radial-gradient(36% 28% at 85% 70%, var(--blue), transparent 70%);
    background-repeat: no-repeat;
    animation: texture-drift 24s ease-in-out infinite;
  }
  @keyframes texture-drift {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
    33%  { transform: translate(-3%, 2.5%) scale(1.04) rotate(2deg); }
    66%  { transform: translate(2.5%, -2%) scale(1.02) rotate(-1.5deg); }
    100% { transform: translate(0, 0) scale(1) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .texture-wave, .texture-wave feTurbulence { animation: none !important; }
  }
  .nav {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #5b6472;
  }
  .logo { font-weight: 700; letter-spacing: .12em; color: #1c2430; }
  .nav-links { display: flex; gap: 26px; }
  .cta-pill {
    display: inline-block;
    margin-top: 4px;
    padding: 9px 20px;
    border-radius: 999px;
    font-size: 12.5px;
    color: #fff;
    background: linear-gradient(120deg, var(--blue2), var(--pink));
  }
 
  .hero-copy { position: relative; z-index: 3; max-width: 480px; margin-top: 9vh; }
  .hero-copy h1 { font-size: 40px; line-height: 1.15; margin: 0 0 14px; }
  .grad-text {
    background: linear-gradient(90deg, var(--blue2), var(--lav), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero-copy p { color: #6b7482; font-size: 14.5px; max-width: 340px; }
 
  /* --- диагональная лента-волна: длинная, живая, непрерывно волнуется --- */
  .ribbon-wrap {
    position: absolute;
    inset: 6% -30% auto auto;
    width: 148%;
    height: 96%;
    z-index: 1;
    pointer-events: none;
    transform: translate(-25%, 35%) rotate(-24deg) scaleY(1.25);
    transform-origin: 80% 20%;
  }
  @media (max-width: 768px) {
    .ribbon-wrap {
      width: 190%;
      height: 35%;
      inset: auto -30% -6% -40%;
      transform: translate(-25%, 10%) rotate(-24deg) scaleY(1.25);
      transform-origin: 80% 100%;
    }
  }
  .ribbon-corner-fill { display: none; }
  @media (max-width: 768px) {
    .ribbon-corner-fill {
      display: block;
      position: absolute;
      left: -20%;
      bottom: -22%;
      width: 72%;
      height: 38%;
      z-index: 1;
      pointer-events: none;
      opacity: .9;
      filter: blur(34px);
      background: radial-gradient(ellipse at 30% 78%, var(--blue2) 0%, var(--lav) 35%, var(--pink) 65%, transparent 78%);
    }
  }
  .ribbon-svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  /* базовое размытие идёт через нативный SVG <filter> (см. defs: fBase/fUnder/fFront/fEdge/fShadow) —
     CSS filter:blur() на анимированных SVG-path ненадёжен в мобильных WebView/Safari и может отрисоваться
     без размытия вообще (плоские "гранёные" слои). Медиа-запрос ниже — лишь опциональный бонус поверх. */
  .ribbon-path.main  { opacity: .95; stroke: rgba(255,255,255,.75); stroke-width: 2; }
  .ribbon-path.under {
    opacity: .8;
  }
  .ribbon-path.front {
    opacity: .6;
    transform-box: fill-box;
    transform-origin: 50% 50%;
    transform: scale(0.88) translateX(9%);
  }
  .ribbon-path.edge-shade {
    opacity: .8;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  .ribbon-path.drop-shadow {
    opacity: .35;
    transform: translate(1.5%, 2.5%);
    pointer-events: none;
  }
  @media (max-width: 768px) {
    .ribbon-path { filter: blur(15px); }
    .ribbon-path.under { filter: blur(22px); }
    .ribbon-path.front { filter: blur(14px); }
    .ribbon-path.edge-shade { filter: blur(10px); }
    .ribbon-path.drop-shadow { filter: blur(38px); }
  }
  @keyframes drift-diag {
    0%   { transform: translate(0,0) rotate(-24deg); }
    50%  { transform: translate(-3.5%, 3%) rotate(-21deg); }
    100% { transform: translate(0,0) rotate(-24deg); }
  }
  @keyframes drift-diag2 {
    0%   { transform: translate(0,0) rotate(-18deg); }
    50%  { transform: translate(3%, -3.5%) rotate(-15deg); }
    100% { transform: translate(0,0) rotate(-18deg); }
  }
 
 
 
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(38px);
    opacity: .6;
    z-index: 1;
    animation: bob 9s ease-in-out infinite;
  }
  .blob.blue {
    width: 46vw; height: 46vw; left: -18vw; bottom: -22vw;
    background: linear-gradient(120deg, var(--blue), #eaf6fb, var(--lav));
    animation-name: bob, flow;
    animation-duration: 9s, 12s;
  }
  .blob.pink {
    width: 40vw; height: 40vw; right: -14vw; top: -8vw;
    background: linear-gradient(120deg, var(--pink), var(--peach));
    animation-name: bob2, flow;
    animation-duration: 11s, 13s;
  }
  @keyframes bob  { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(2%, -3%) scale(1.05);} }
  @keyframes bob2 { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(-2.5%, 2.5%) scale(.97);} }
 
 
 
 
  linearGradient stop.a { animation: stopA 8s ease-in-out infinite; }
  linearGradient stop.b { animation: stopB 8s ease-in-out infinite; }
  @keyframes stopA { 0%,100% { stop-color: var(--blue2);} 50% { stop-color: var(--lav);} }
  @keyframes stopB { 0%,100% { stop-color: var(--pink);}  50% { stop-color: var(--peach);} }
 
  /* ============ СКВОЗНАЯ ДИАГОНАЛЬНАЯ ВОЛНА ПО ВСЕМУ САЙТУ ============ */
  .sweep-rotator {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 5;
    mix-blend-mode: soft-light;
  }
  .sweep-band {
    position: absolute;
    top: -60%; left: -60%;
    width: 220%; height: 220%;
    transform: rotate(-24deg);
    background-image: linear-gradient(90deg,
      transparent 0%,
      var(--blue2) 44%,
      var(--lav) 50%,
      var(--pink) 56%,
      transparent 100%);
    background-size: 45% 100%;
    background-repeat: no-repeat;
    animation: sweep-move 8s linear infinite;
  }
  @keyframes sweep-move {
    0%   { background-position: -70% 0; }
    100% { background-position: 170% 0; }
  }
 
  @media (prefers-reduced-motion: reduce) {
    body, .ribbon, .texture-wave, .blob, .footer svg.line path, linearGradient stop, .sweep-band { animation: none !important; }
  }
</style>
</head>
<body>
 
<section class="hero">
 
  <div class="bg-stack">
    <div class="bg-gradient"></div>
    <div class="texture-wave"></div>
 
  <div class="ribbon-corner-fill"></div>
  <div class="ribbon-wrap">
    <!-- содержимое волны (SVG) подгружается из wave.svg, см. скрипт в конце body -->
  </div>
  </div>
 
  <div class="nav">
    <div class="logo">NEXORA</div>
    <div class="nav-links"><span>Услуги</span><span>Проекты</span><span>Тарифы</span></div>
    <div class="cta-pill">Обсудить проект</div>
  </div>
 
  <div class="hero-copy">
    <h1>Ваш бизнес<br>в <span class="grad-text">цифровом пространстве</span></h1>
    <p>Создаём сайты, бренды и digital&#8209;решения, которые приносят результат.</p>
  </div>
</section>

<script>
  // Данные волны (SVG-контур + анимация) вынесены в отдельный файл wave.svg,
  // чтобы не раздувать этот HTML — подгружаем и вставляем их в DOM здесь же,
  // поэтому все CSS-классы/переменные (.ribbon-path, var(--pink) и т.д.) продолжают работать как раньше.
  fetch('wave.svg')
    .then(function (r) { return r.text(); })
    .then(function (svgMarkup) {
      document.querySelector('.ribbon-wrap').innerHTML = svgMarkup;
    })
    .catch(function (err) {
      console.error('Не удалось загрузить wave.svg — проверь, что файл лежит рядом с этой HTML-страницей.', err);
    });
</script>
</body>
</html>
